[project]
name = "cc-shap"
version = "0.1.0"
description = "CC-SHAP: measuring the self-consistency / faithfulness of LLM natural-language explanations"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Deep learning core (CUDA 12.x wheels from PyPI run on the RTX 3090s here)
    "torch>=2.4,<2.6",
    "accelerate>=0.30,<1.1",
    # Numerics / data. numpy is kept <2.0 for spacy/numba + the vendored shap API.
    "numpy>=1.24,<2.0",
    "pandas>=2.1,<2.3",
    "scipy>=1.11,<1.14",
    "scikit-learn>=1.3,<1.6",
    "matplotlib>=3.7,<3.10",
    "numba>=0.59,<0.61",
    # Hugging Face stack
    "transformers>=4.44,<4.50",
    "huggingface-hub>=0.24,<0.26",
    "tokenizers>=0.19,<0.21",
    "safetensors>=0.4",
    "sentencepiece>=0.1.99",
    "sacremoses>=0.0.53",
    "protobuf>=3.20,<5",
    # NLP tooling used by the faithfulness tests
    "spacy>=3.7,<3.8",
    "nltk>=3.8",
    # IO / utilities
    "tqdm>=4.65",
    "requests>=2.31",
    "ipython>=8.15",
    # Used by the vendored `shap/` package
    "slicer>=0.0.7",
    "cloudpickle>=2.2",
    "packaging>=23.0",
]

# This repo is a script (faithfulness.py) plus a vendored, modified `shap/` package,
# not a distributable library, so uv manages the environment without building it.
[tool.uv]
package = false

[tool.ruff.lint.per-file-ignores]
# faithfulness.py must call hf_env.load_env() before importing transformers so the
# HF token/cache env vars take effect, which necessarily puts imports after a statement.
"faithfulness.py" = ["E402"]

